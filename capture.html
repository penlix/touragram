<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touragram — Capture</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .capture-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .capture-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(15, 18, 24, 0.55) 0%,
        rgba(15, 18, 24, 0.70) 50%,
        rgba(15, 18, 24, 0.85) 100%
      );
      pointer-events: none;
    }

    .capture-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-5);
      max-width: 320px;
    }

    .capture-fallback-text {
      font-size: var(--text-md);
      color: var(--ink-primary);
      text-align: center;
    }

    .capture-loader {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .capture-loader-label,
    .capture-empty {
      font-size: var(--text-sm);
      color: var(--ink-primary);
      opacity: 0.65;
    }

    .capture-loader-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--ink-primary);
      animation: capture-loader-pulse 1.3s ease-in-out infinite;
    }

    @keyframes capture-loader-pulse {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1.0; }
    }

    .capture-carousel {
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms var(--ease-out);
    }

    .capture-carousel.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .capture-carousel .card {
      width: 240px;
    }
  </style>
</head>
<body class="screen">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <video class="capture-video" playsinline autoplay muted></video>

  <div class="capture-overlay" hidden></div>

  <div class="screen-center capture-fallback" hidden>
    <p class="capture-fallback-text">Camera access is needed. Enable it in your browser settings and refresh.</p>
    <button type="button" class="btn capture-fallback-retry" data-variant="primary" data-size="sm">Enable browser camera</button>
  </div>

  <div class="screen-center capture-loader" hidden>
    <div class="capture-loader-dot"></div>
    <span class="capture-loader-label">Loading</span>
  </div>

  <div class="screen-center capture-empty" hidden>No landmarks found</div>

  <div class="screen-spacer"></div>

  <div class="carousel capture-carousel" hidden></div>

  <div class="bottom-actions">
    <a class="btn" data-variant="ghost" data-size="md" data-shape="circle" data-slot="left" href="/" aria-label="Close" data-state-button="ghost-close">
      <i data-lucide="x"></i>
    </a>
    <button type="button" class="btn" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary" aria-label="Capture photo" data-state-button="camera">
      <i data-lucide="camera"></i>
    </button>
    <button type="button" class="btn" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary" aria-label="Close" data-state-button="primary-close" hidden>
      <i data-lucide="x"></i>
    </button>
  </div>

  <script>
    const FAKE_RESULTS = false;

    const landmarks = [
      { name: 'Brandenburg Gate', imagePlaceholder: 'linear-gradient(135deg, #B5A18C, #6B5340)' },
      { name: 'Reichstag',        imagePlaceholder: 'linear-gradient(135deg, #8A9DA3, #4A5860)' },
      { name: 'TV Tower',         imagePlaceholder: 'linear-gradient(135deg, #A87C5C, #5A3F2A)' }
    ];

    const video = document.querySelector('.capture-video');
    const fallback = document.querySelector('.capture-fallback');
    const fallbackRetry = document.querySelector('.capture-fallback-retry');
    const overlay = document.querySelector('.capture-overlay');
    const loader = document.querySelector('.capture-loader');
    const empty = document.querySelector('.capture-empty');
    const carousel = document.querySelector('.capture-carousel');
    const ghostClose = document.querySelector('[data-state-button="ghost-close"]');
    const camera = document.querySelector('[data-state-button="camera"]');
    const primaryClose = document.querySelector('[data-state-button="primary-close"]');

    let currentState = 'live';

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        video.hidden = false;
        fallback.hidden = true;
        camera.classList.remove('is-disabled');
      } catch (error) {
        video.hidden = true;
        fallback.hidden = false;
        camera.classList.add('is-disabled');
      }
    }

    function captureFrame() {
      video.pause();
    }

    function renderState(state) {
      currentState = state;
      switch (state) {
        case 'live':
          video.play().catch(() => startCamera());
          overlay.hidden = true;
          loader.hidden = true;
          empty.hidden = true;
          carousel.hidden = true;
          carousel.classList.remove('is-visible');
          ghostClose.hidden = false;
          camera.hidden = false;
          camera.classList.remove('is-disabled');
          primaryClose.hidden = true;
          break;
        case 'loading':
          overlay.hidden = false;
          loader.hidden = false;
          empty.hidden = true;
          carousel.hidden = true;
          carousel.classList.remove('is-visible');
          ghostClose.hidden = false;
          camera.hidden = false;
          camera.classList.add('is-disabled');
          primaryClose.hidden = true;
          break;
        case 'empty':
          overlay.hidden = false;
          loader.hidden = true;
          empty.hidden = false;
          carousel.hidden = true;
          carousel.classList.remove('is-visible');
          ghostClose.hidden = false;
          camera.hidden = false;
          camera.classList.remove('is-disabled');
          primaryClose.hidden = true;
          break;
        case 'results':
          overlay.hidden = false;
          loader.hidden = true;
          empty.hidden = true;
          carousel.hidden = false;
          carousel.classList.add('is-visible');
          ghostClose.hidden = true;
          camera.hidden = true;
          camera.classList.remove('is-disabled');
          primaryClose.hidden = false;
          break;
      }
    }

    landmarks.forEach(landmark => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = 'results.html';
      card.innerHTML = `
        <div class="card-media" style="background: ${landmark.imagePlaceholder}"></div>
        <div class="card-title">${landmark.name}</div>
      `;
      carousel.appendChild(card);
    });

    camera.addEventListener('click', () => {
      if (currentState === 'live') {
        captureFrame();
        renderState('loading');
        setTimeout(() => {
          renderState(FAKE_RESULTS ? 'results' : 'empty');
        }, 2000);
      } else if (currentState === 'empty') {
        renderState('live');
      }
    });

    primaryClose.addEventListener('click', () => {
      renderState('live');
    });

    fallbackRetry.addEventListener('click', startCamera);

    startCamera();
  </script>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>

  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
