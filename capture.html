<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touragram — Capture</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .capture-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .capture-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(15, 18, 24, 0.55) 0%,
        rgba(15, 18, 24, 0.70) 50%,
        rgba(15, 18, 24, 0.85) 100%
      );
      pointer-events: none;
    }

    .capture-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-5);
      max-width: 320px;
    }

    .capture-fallback-text {
      font-size: var(--text-md);
      color: var(--ink-primary);
      text-align: center;
    }

    .capture-loader {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .capture-loader-label,
    .capture-empty {
      font-size: var(--text-sm);
      color: var(--ink-primary);
      opacity: 0.65;
    }

    .capture-loader-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--ink-primary);
      animation: capture-loader-pulse 1.3s ease-in-out infinite;
    }

    @keyframes capture-loader-pulse {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1.0; }
    }

    .capture-carousel {
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms var(--ease-out);
    }

    .capture-carousel.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .capture-carousel .card {
      width: 240px;
    }

    .capture-carousel.carousel--single .card {
      width: 100%;
    }
  </style>
</head>
<body class="screen">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <video class="capture-video" playsinline autoplay muted></video>

  <div class="capture-overlay" hidden></div>

  <div class="screen-center capture-fallback" hidden>
    <p class="capture-fallback-text">Camera access is needed. Enable it in your browser settings and refresh.</p>
    <button type="button" class="btn capture-fallback-retry" data-variant="primary" data-size="sm">Enable browser camera</button>
  </div>

  <div class="screen-center capture-loader" hidden>
    <div class="capture-loader-dot"></div>
    <span class="capture-loader-label">Loading</span>
  </div>

  <div class="screen-center capture-empty" hidden>No landmarks found</div>

  <div class="screen-spacer"></div>

  <div class="carousel capture-carousel" hidden></div>

  <div class="bottom-actions">
    <a class="btn" data-variant="ghost" data-size="md" data-shape="circle" data-slot="left" href="/" aria-label="Close" data-state-button="ghost-close">
      <i data-lucide="x"></i>
    </a>
    <button type="button" class="btn" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary" aria-label="Capture photo" data-state-button="camera">
      <i data-lucide="camera"></i>
    </button>
    <button type="button" class="btn" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary" aria-label="Close" data-state-button="primary-close" hidden>
      <i data-lucide="x"></i>
    </button>
  </div>

  <div class="sheet-backdrop" hidden></div>

  <div class="sheet" hidden>
    <div class="sheet-handle-bar">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-content">
      <div class="carousel sheet-gallery">
        <div class="sheet-photo" style="background: linear-gradient(135deg, var(--color-accent-default), var(--color-neutral-1));"></div>
        <div class="sheet-photo" style="background: linear-gradient(135deg, var(--color-neutral-2), var(--color-accent-default));"></div>
        <div class="sheet-photo" style="background: linear-gradient(45deg, var(--color-neutral-1), var(--color-neutral-2));"></div>
        <div class="sheet-photo" style="background: linear-gradient(135deg, var(--color-accent-default), var(--color-neutral-2));"></div>
        <div class="sheet-photo" style="background: linear-gradient(180deg, var(--color-neutral-2), var(--color-neutral-1));"></div>
        <div class="sheet-photo" style="background: linear-gradient(45deg, var(--color-neutral-1), var(--color-accent-default));"></div>
        <div class="sheet-photo" style="background: linear-gradient(90deg, var(--color-neutral-2), var(--color-accent-default));"></div>
        <div class="sheet-photo" style="background: linear-gradient(180deg, var(--color-neutral-1), var(--color-neutral-2));"></div>
      </div>
      <div class="sheet-text">
        <h1 class="sheet-title"></h1>
        <div class="sheet-body"></div>
      </div>
    </div>
    <div class="bottom-actions sheet-actions">
      <button type="button" class="btn" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary" aria-label="Close" data-state-button="sheet-close">
        <i data-lucide="x"></i>
      </button>
      <button type="button" class="btn" data-variant="ghost" data-size="md" data-shape="circle" data-slot="right" aria-label="Share" data-state-button="sheet-share">
        <i data-lucide="share"></i>
      </button>
    </div>
  </div>

  <script>
    const cardGradients = [
      'linear-gradient(135deg, #B5A18C, #6B5340)',
      'linear-gradient(135deg, #8A9DA3, #4A5860)',
      'linear-gradient(135deg, #A87C5C, #5A3F2A)'
    ];

    const video = document.querySelector('.capture-video');
    const fallback = document.querySelector('.capture-fallback');
    const fallbackRetry = document.querySelector('.capture-fallback-retry');
    const overlay = document.querySelector('.capture-overlay');
    const loader = document.querySelector('.capture-loader');
    const empty = document.querySelector('.capture-empty');
    const carousel = document.querySelector('.capture-carousel');
    const ghostClose = document.querySelector('[data-state-button="ghost-close"]');
    const camera = document.querySelector('[data-state-button="camera"]');
    const primaryClose = document.querySelector('[data-state-button="primary-close"]');
    const sheet = document.querySelector('.sheet');
    const sheetBackdrop = document.querySelector('.sheet-backdrop');
    const sheetHandleBar = document.querySelector('.sheet-handle-bar');
    const sheetClose = document.querySelector('[data-state-button="sheet-close"]');
    const sheetTitle = document.querySelector('.sheet-title');
    const sheetBody = document.querySelector('.sheet-body');

    let currentState = 'live';
    let sheetOpen = false;
    let dragStartY = 0;
    let dragCurrentY = 0;
    let isDragging = false;
    let capturedImage = null;
    let results = [];
    let latitude = null;
    let longitude = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        video.hidden = false;
        fallback.hidden = true;
        camera.classList.remove('is-disabled');
      } catch (error) {
        video.hidden = true;
        fallback.hidden = false;
        camera.classList.add('is-disabled');
      }
    }

    function captureFrame() {
      // Draw the current video frame onto an off-screen canvas, downscaled so
      // the long edge is at most 1568px (Claude vision's effective max, and
      // well under Vercel's 4.5MB request-body limit at quality 0.8).
      const canvas = document.createElement('canvas');
      const maxEdge = 1568;
      const scale = Math.min(1, maxEdge / Math.max(video.videoWidth, video.videoHeight));
      canvas.width = video.videoWidth * scale;
      canvas.height = video.videoHeight * scale;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      capturedImage = canvas.toDataURL('image/jpeg', 0.8);
      video.pause();
    }

    function renderState(state) {
      currentState = state;
      switch (state) {
        case 'live':
          video.play().catch(() => startCamera());
          overlay.hidden = true;
          loader.hidden = true;
          empty.hidden = true;
          carousel.hidden = true;
          carousel.classList.remove('is-visible');
          ghostClose.hidden = false;
          camera.hidden = false;
          camera.classList.remove('is-disabled');
          primaryClose.hidden = true;
          break;
        case 'loading':
          overlay.hidden = false;
          loader.hidden = false;
          empty.hidden = true;
          carousel.hidden = true;
          carousel.classList.remove('is-visible');
          ghostClose.hidden = false;
          camera.hidden = false;
          camera.classList.add('is-disabled');
          primaryClose.hidden = true;
          break;
        case 'empty':
          overlay.hidden = false;
          loader.hidden = true;
          empty.hidden = false;
          carousel.hidden = true;
          carousel.classList.remove('is-visible');
          ghostClose.hidden = false;
          camera.hidden = false;
          camera.classList.remove('is-disabled');
          primaryClose.hidden = true;
          break;
        case 'results':
          overlay.hidden = false;
          loader.hidden = true;
          empty.hidden = true;
          carousel.hidden = false;
          carousel.classList.add('is-visible');
          ghostClose.hidden = true;
          camera.hidden = true;
          camera.classList.remove('is-disabled');
          primaryClose.hidden = false;
          break;
      }
    }

    function renderCards(list) {
      carousel.innerHTML = '';
      carousel.classList.toggle('carousel--single', list.length === 1);
      list.forEach((landmark, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';

        const media = document.createElement('div');
        media.className = 'card-media';
        media.style.background = cardGradients[i % cardGradients.length];

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = landmark.name;

        card.appendChild(media);
        card.appendChild(title);
        card.addEventListener('click', () => openSheet(landmark));
        carousel.appendChild(card);
      });
    }

    function openSheet(landmark) {
      // Populate the sheet from the landmark data. textContent (not innerHTML)
      // so model-generated text can never inject markup.
      sheetTitle.textContent = landmark.name;
      sheetBody.innerHTML = '';
      (landmark.description || '').split('\n\n').forEach(para => {
        const p = document.createElement('p');
        p.textContent = para;
        sheetBody.appendChild(p);
      });

      sheetOpen = true;
      sheet.hidden = false;
      sheetBackdrop.hidden = false;
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => {
        sheet.classList.add('is-open');
        sheetBackdrop.classList.add('is-open');
      });
    }

    function closeSheet() {
      sheetOpen = false;
      sheet.classList.remove('is-open');
      sheetBackdrop.classList.remove('is-open');
      sheet.style.transform = '';
      setTimeout(() => {
        if (!sheetOpen) {
          sheet.hidden = true;
          sheetBackdrop.hidden = true;
          document.body.style.overflow = '';
        }
      }, 250);
    }

    sheetClose.addEventListener('click', closeSheet);

    sheetHandleBar.addEventListener('touchstart', (e) => {
      dragStartY = e.touches[0].clientY;
      dragCurrentY = dragStartY;
      isDragging = true;
      sheet.style.transition = 'none';
    });

    sheetHandleBar.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      dragCurrentY = e.touches[0].clientY;
      const dragDistance = Math.min(Math.max(0, dragCurrentY - dragStartY), sheet.offsetHeight);
      sheet.style.transform = `translateY(${dragDistance}px)`;
    });

    sheetHandleBar.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      sheet.style.transition = '';
      const dragDistance = dragCurrentY - dragStartY;
      const dismissThreshold = sheet.offsetHeight * 0.15;
      if (dragDistance > dismissThreshold) {
        closeSheet();
      } else {
        sheet.style.transform = '';
      }
    });

    camera.addEventListener('click', async () => {
      if (currentState === 'live') {
        captureFrame();
        renderState('loading');

        // Abort the request if it runs longer than 30s so the loader can't
        // spin forever — a timeout falls through to the empty state.
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        try {
          const res = await fetch('/api/identify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: capturedImage, lat: latitude, lng: longitude }),
            signal: controller.signal
          });
          const data = await res.json();
          results = (res.ok && Array.isArray(data.landmarks)) ? data.landmarks : [];
        } catch (error) {
          results = [];
        } finally {
          clearTimeout(timeoutId);
        }

        if (results.length) {
          renderCards(results);
          renderState('results');
        } else {
          renderState('empty');
        }
      } else if (currentState === 'empty') {
        renderState('live');
      }
    });

    primaryClose.addEventListener('click', () => {
      renderState('live');
    });

    function requestLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => { latitude = pos.coords.latitude; longitude = pos.coords.longitude; },
        () => { /* denied or failed — leave null, location is a hint not a requirement */ },
        { timeout: 8000 }
      );
    }

    fallbackRetry.addEventListener('click', startCamera);

    startCamera();
    requestLocation();
  </script>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>

  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
