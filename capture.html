<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touragram — Capture</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .capture-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .capture-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-5);
      max-width: 320px;
    }

    .capture-fallback-text {
      font-size: var(--text-sm);
      color: var(--ink-primary);
      text-align: center;
    }
  </style>
</head>
<body class="screen">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <video class="capture-video" playsinline autoplay muted></video>

  <div class="screen-center capture-fallback" hidden>
    <p class="capture-fallback-text">Camera access is needed. Enable it in your browser settings and refresh.</p>
    <button type="button" class="btn capture-fallback-retry" data-variant="primary" data-size="sm">Enable browser camera</button>
  </div>

  <div class="screen-spacer"></div>

  <div class="bottom-actions">
    <a class="btn" data-variant="ghost" data-size="md" data-shape="circle" data-slot="left" href="/" aria-label="Close">
      <i data-lucide="x"></i>
    </a>
    <a class="btn" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary" href="find.html" aria-label="Capture photo">
      <i data-lucide="camera"></i>
    </a>
  </div>

  <script>
    const video = document.querySelector('.capture-video');
    const fallback = document.querySelector('.capture-fallback');
    const fallbackRetry = document.querySelector('.capture-fallback-retry');
    const cameraButton = document.querySelector('.bottom-actions [data-slot="primary"]');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        video.hidden = false;
        fallback.hidden = true;
        cameraButton.classList.remove('is-disabled');
      } catch (error) {
        video.hidden = true;
        fallback.hidden = false;
        cameraButton.classList.add('is-disabled');
      }
    }

    fallbackRetry.addEventListener('click', startCamera);

    startCamera();
  </script>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>

  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
