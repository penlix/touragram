<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touragram — Capture</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="screen">

  <div class="screen-spacer"></div>

  <div class="bottom-actions">
    <a class="btn" data-variant="ghost" data-size="lg" data-shape="circle" data-slot="left" href="welcome.html" aria-label="Close">
      <i data-lucide="x"></i>
    </a>
    <button class="btn" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary" aria-label="Capture photo">
      <i data-lucide="camera"></i>
    </button>
  </div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>

</body>
</html>
