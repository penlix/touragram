<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touragram</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .welcome-wordmark {
      text-align: center;
      font-size: var(--text-5xl);
      padding-inline: var(--space-5);
    }

    .welcome-go {
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-bold);
    }
  </style>
</head>
<body class="screen">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="screen-center">
    <h1 class="welcome-wordmark">Touragram</h1>
  </div>

  <div class="bottom-actions">
    <a class="btn welcome-go" href="capture.html" data-variant="primary" data-size="lg" data-shape="circle" data-slot="primary">
      <span>GO</span>
    </a>
  </div>

  <script>
    const photos = [
      { city: "Paris",          url: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1600&q=80&auto=format&fit=crop" },
      { city: "Tokyo",          url: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=1600&q=80&auto=format&fit=crop" },
      { city: "New York",       url: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=1600&q=80&auto=format&fit=crop" },
      { city: "London",         url: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=1600&q=80&auto=format&fit=crop" },
      { city: "Istanbul",       url: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?w=1600&q=80&auto=format&fit=crop" },
      { city: "Marrakech",      url: "https://images.unsplash.com/photo-1597212720158-e21260ff34a6?w=1600&q=80&auto=format&fit=crop" },
      { city: "Rio de Janeiro", url: "https://images.unsplash.com/photo-1483729558449-99ef09a8c325?w=1600&q=80&auto=format&fit=crop" },
      { city: "Sydney",         url: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=1600&q=80&auto=format&fit=crop" },
      { city: "Bangkok",        url: "https://images.unsplash.com/photo-1508009603885-50cf7c579365?w=1600&q=80&auto=format&fit=crop" },
      { city: "Cairo",          url: "https://images.unsplash.com/photo-1572252009286-268acec5ca0a?w=1600&q=80&auto=format&fit=crop" },
      { city: "Mexico City",    url: "https://images.unsplash.com/photo-1518105779142-d975f22f1b0a?w=1600&q=80&auto=format&fit=crop" },
      { city: "Hong Kong",      url: "https://images.unsplash.com/photo-1536599018102-9f803c140fc1?w=1600&q=80&auto=format&fit=crop" },
      { city: "Singapore",      url: "https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=1600&q=80&auto=format&fit=crop" },
      { city: "Dubai",          url: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=1600&q=80&auto=format&fit=crop" },
      { city: "Cape Town",      url: "https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=1600&q=80&auto=format&fit=crop" }
    ];

    const pick = photos[Math.floor(Math.random() * photos.length)];
    document.body.style.backgroundImage =
      `linear-gradient(180deg, rgba(15, 18, 24, 0.35) 0%, rgba(15, 18, 24, 0.85) 100%), url('${pick.url}')`;
  </script>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>

</body>
</html>
